<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Valentino Nail Bar</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Poppins", sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                color: #fff;
                padding: 20px;
            }

            .container {
                width: 100%;
                max-width: 420px;
                text-align: center;
            }

            .logo-area {
                margin-bottom: 28px;
            }

            .logo-circle {
                width: 130px;
                height: 130px;
                border-radius: 50%;
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 16px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                border: 3px solid rgba(255, 255, 255, 0.15);
                overflow: hidden;
                padding: 10px;
            }

            .logo-circle img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .brand-name {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 0.5px;
            }

            .brand-name span {
                color: #d4a017;
            }

            .tagline {
                font-size: 13px;
                color: rgba(255, 255, 255, 0.55);
                margin-top: 4px;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            .links {
                display: flex;
                flex-direction: column;
                gap: 14px;
                margin-top: 10px;
            }

            .link-btn {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 16px 22px;
                border-radius: 14px;
                background: rgba(255, 255, 255, 0.07);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                text-decoration: none;
                color: #fff;
                font-size: 16px;
                font-weight: 600;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }

            .link-btn::before {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.05),
                    transparent
                );
                transition: left 0.5s ease;
            }

            .link-btn:hover::before {
                left: 100%;
            }

            .link-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
                border-color: rgba(255, 255, 255, 0.25);
            }

            .link-btn.instagram:hover {
                background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
                border-color: transparent;
            }

            .link-btn.facebook:hover {
                background: linear-gradient(135deg, #1877f2, #42a5f5);
                border-color: transparent;
            }

            .link-btn.tiktok:hover {
                background: linear-gradient(135deg, #010101, #69c9d0);
                border-color: #ee1d52;
            }

            .link-icon {
                width: 42px;
                height: 42px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .link-icon svg {
                width: 24px;
                height: 24px;
                fill: #fff;
            }

            .link-icon.ig {
                background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            }

            .link-icon.fb {
                background: #1877f2;
            }

            .link-icon.tt {
                background: #010101;
                border: 1px solid #333;
            }

            .link-text {
                text-align: left;
            }

            .link-label {
                font-size: 15px;
                font-weight: 600;
            }

            .link-sub {
                font-size: 11px;
                color: rgba(255, 255, 255, 0.5);
                font-weight: 400;
            }

            .footer {
                margin-top: 40px;
                font-size: 12px;
                color: rgba(255, 255, 255, 0.3);
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-6px);
                }
            }

            .logo-area {
                animation: float 3s ease-in-out infinite;
            }
        </style>
    </head>
    <body>
        <div class="container">

                <div class="logo-circle">
                    <img src="valentino.png" alt="Valentino Nail Bar Logo" />
                </div>
                <div class="brand-name">Valentino <span>Nail Bar</span></div>
                <div class="tagline">University Location</div>
            </div>

            <div class="links">

                    target="_blank"

                    <div class="link-icon ig">

                </a>

                        <div class="link-sub">

                <a

                        </svg>
                    </div>
                    <div class="link-text">
                        <div class="link-label">TikTok</div>
                        <div class="link-sub">@valentinonailbarnc</div>
                    </div>
                </a>
            </div>

            <div class="footer">
                &copy; 2026 Valentino Nail Bar - University
            </div>
        </div>
    </body>
</html>
